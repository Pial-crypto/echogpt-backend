services:
  postgres:
    image: postgres:16
    container_name: echogpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echogpt
    ports:
      - "5433:5432"
    volumes:
      - echogpt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echogpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echogpt-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/echogpt?schema=public"
      PORT: 3000

      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      TAVILY_API_KEY: "${TAVILY_API_KEY}"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  echogpt_postgres_data: